<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Bright Mbulle</title>
    <link rel="icon" href="data:,">
    <style>
        :root{
            --first: hsl(250, 69%, 61%);
            --first-alt: hsl(250, 57%, 53%);
            --title: hsl(250, 8%, 15%);
            --text: hsl(250, 8%, 45%);
            --body: hsl(250, 60%, 99%);
        }
        @media (prefers-color-scheme: dark){
            :root{
                --title: hsl(250, 8%, 95%);
                --text: hsl(250, 8%, 75%);
                --body: hsl(250, 28%, 12%);
            }
        }
        *{ box-sizing: border-box; margin: 0; }
        body{
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: radial-gradient(60% 50% at 50% 0%, hsla(250, 69%, 61%, .14), transparent), var(--body);
            color: var(--text);
            text-align: center;
        }
        .code{
            font-size: clamp(5rem, 22vw, 9rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -.04em;
            background: linear-gradient(135deg, var(--first), hsl(250, 92%, 80%));
            -webkit-background-clip: text;
                    background-clip: text;
            color: transparent;
        }
        h1{
            margin: 1rem 0 .5rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--title);
        }
        p{ max-width: 26rem; margin: 0 auto 2rem; line-height: 1.6; }
        a{
            display: inline-block;
            padding: 1rem 1.75rem;
            border-radius: 5rem;
            background: linear-gradient(135deg, var(--first), var(--first-alt));
            color: #fff;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 10px 24px -10px hsla(250, 69%, 61%, .6);
            transition: transform .3s;
        }
        a:hover{ transform: translateY(-3px); }
    </style>
</head>
<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a href="/">Back to the homepage</a>
    </main>
</body>
</html>
