# Builds the site and deploys it to Cloudflare Pages (brightmbulle.pages.dev)
# every time main changes, e.g. when a pull request is merged.
#
# Needs, in GitHub repo Settings > Secrets and variables > Actions:
#   Secret   CLOUDFLARE_API_TOKEN   token with "Account > Cloudflare Pages > Edit"
#   Variable CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Never run two deploys at once; a newer push replaces a waiting one.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install wrangler
        run: npm ci

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
